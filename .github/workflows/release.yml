name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: |
          npm ci

      - name: Check project structure
        run: |
          echo "=== Project Structure ==="
          ls -la
          echo "=== src-tauri directory ==="
          ls -la src-tauri/
          echo "=== Icons directory ==="
          ls -la src-tauri/icons/ || echo "Icons directory missing!"

      - name: Build frontend
        run: |
          npm run build
        env:
          CI: true

      - name: Build Tauri app
        run: |
          npm run tauri build -- --verbose
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Check build outputs
        run: |
          echo "=== Checking build outputs ==="
          ls -la src-tauri/target/release/bundle/ || echo "Bundle directory not found"
          ls -la src-tauri/target/release/bundle/msi/ || echo "MSI directory not found"
          ls -la src-tauri/target/release/bundle/nsis/ || echo "NSIS directory not found"

      - name: Upload MSI to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
